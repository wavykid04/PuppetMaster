name: Lint & Notebook Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install linting tools
        run: pip install nbformat nbconvert
      - name: Validate notebook format
        run: python -c "import nbformat; nbformat.read(open('PuppetMaster.ipynb'), as_version=4)"
      - name: Check notebook cells
        run: jupyter nbconvert --to script PuppetMaster.ipynb --stdout > /dev/null
