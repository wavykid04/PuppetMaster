[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puppetmaster"
version = "0.1.0"
description = "Disentangled face swap research code (SD + conditioning adapters). Adapters are currently untrained."
readme = "README.md"
requires-python = ">=3.10,<3.12"
# Core deps are light so the package (config, seeding, CPU tests) imports without GPU stacks.
dependencies = [
    "numpy==1.26.4",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
torch = [
    "torch==2.2.2",
    "torchvision==0.17.2",
]
full = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "diffusers==0.27.2",
    "transformers==4.40.0",
    "accelerate==0.29.3",
    "huggingface-hub==0.22.2",
    "insightface==0.7.3",
    "onnxruntime==1.17.1",
    "face-alignment==1.4.1",
    "kornia==0.7.2",
    "scipy==1.11.4",
    "opencv-python==4.9.0.80",
    "Pillow==10.3.0",
    "scikit-image==0.22.0",
]
gpu = ["onnxruntime-gpu==1.17.1"]
test = ["pytest==8.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
puppetmaster = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
