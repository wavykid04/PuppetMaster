name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only torch and test deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Validate notebook JSON
        run: python -c "import json; json.load(open('PuppetMaster.ipynb', encoding='utf-8'))"
      - name: Run tests (CPU only, no weight downloads)
        env:
          HF_HUB_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q
